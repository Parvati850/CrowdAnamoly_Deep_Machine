[pytest]
# Run tests with the project virtual environment:
#   .\.venv\Scripts\python.exe -m pytest tests/ -v
#
# Or after activating the venv:
#   pytest tests/ -v

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Suppress the sklearn single-class UserWarning (expected in unit tests
# that use tiny synthetic datasets with only one class in y_true).
filterwarnings =
    ignore::UserWarning:sklearn.metrics._classification

# Show test durations for the 10 slowest tests
addopts = --tb=short --durations=10
